
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:taskPulse}
    username: ${DB_USERNAME:taskpulse_user}
    password: ${DB_PASSWORD:taskPulse}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s

  cache:
    type: redis

app:
  security:
    jwt:
      secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWxvY2FsLWRldi1rZXktZm9yLWhzNTEyLXNpZ25pbmctdmVyeS1sb25nLXNlY3VyZS1rZXk=}
      expiration-ms: 90000


taskflow:
  kafka:
    topics:
      task-events: task-events
  outbox:
    publisher-delay-ms: 5000
    max-attempts: 5
    recovery-delay-ms: 60000


resilience4j:
  circuitbreaker:
    instances:
      kafkaPublisher:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10 # evaluate 10 calls
        minimum-number-of-calls: 10 # take at least 10 calls
        failure-rate-threshold: 50 # 50% failure threshold
        slow-call-duration-threshold: 2s # considered slow if no response in 2 sec
        slow-call-rate-threshold: 50 # if 5/10 are slow then open the circuit
        wait-duration-in-open-state: 30s # wait 30sec from open to half open
        permitted-number-of-calls-in-half-open-state: 3 # allow 3 requests in half open state
        register-health-indicator: true # enables the Resilience4j auto-configuration health indicator inside Spring Boot Actuator.


management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true # make sure infra doesn't use this to restart since a faulty email service shouldn't restart the app.
  observations:
    annotations:
      enabled: true # to enable annotations like @observed or @Timed
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}


logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis.cache: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE



